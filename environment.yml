name: evodyn
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - matplotlib
  - networkx
  - biopython
  - pyyaml
  - mdtraj
  - pytest
  # external stages. Uncomment the ones you need; none are required for
  # `evodyn benchmark` or for the test suite.
